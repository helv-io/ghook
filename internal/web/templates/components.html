{{define "brandmark"}}<div class="brandmark"><img src="/favicon.svg" alt="" width="28" height="28"><span class="gh-word">ghook</span></div>{{end}}
{{define "copybox"}}<button type="button" class="copybox" data-copy-text="{{.Text}}" aria-label="Copy {{.Label}}"><code>{{.Text}}</code><span class="copyhint">Tap to copy</span></button>{{end}}
{{define "pill"}}<span class="pill {{.Class}}"{{if .Tip}} title="{{.Tip}}"{{end}}>{{.Text}}</span>{{end}}

# Local trial of ghook. Sign-in is Google; you still need an OAuth web client
# and (for a live watch) a Pub/Sub service account.
#   GOOGLE_CLIENT_FILE=./google-client.json PUBSUB_SA_FILE=./pubsub-sa.json \
#     docker compose -f docker-compose.quickstart.yml up -d
# Add http://localhost:8080/admin/google/callback as an authorized redirect URI.
# Do not expose this compose file to the internet without TLS.
services:
  ghook:
    container_name: ghook
    image: ghcr.io/helv-io/ghook:${GHOOK_TAG:-latest}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${GHOOK_PORT:-8080}:8080
    environment:
      - PUBLIC_URL=http://localhost:${GHOOK_PORT:-8080}
      - GOOGLE_CLIENT_FILE=/run/secrets/google-client.json
      - PUBSUB_SA_FILE=/run/secrets/pubsub-sa.json
      - PUBSUB_TOPIC=gmail-inbox
      - PUBSUB_SUBSCRIPTION=ghook-pull
    volumes:
      - ghook-data:/data
      - ${GOOGLE_CLIENT_FILE:-./google-client.json}:/run/secrets/google-client.json:ro
      - ${PUBSUB_SA_FILE:-./pubsub-sa.json}:/run/secrets/pubsub-sa.json:ro
    healthcheck:
      test: ["CMD", "/ghook", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ghook-data:

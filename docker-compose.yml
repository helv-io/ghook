# Set PUBLIC_URL, GOOGLE_CLIENT_FILE, and PUBSUB_SA_FILE.
# Local build: docker build -t ghook .
services:
  ghook:
    container_name: ghook
    image: ghcr.io/helv-io/ghook:latest
    restart: always
    ports:
      - 8080:8080
    environment:
      - PUBLIC_URL=https://ghook.example.com
      - GOOGLE_CLIENT_FILE=/run/secrets/google-client.json
      - PUBSUB_SA_FILE=/run/secrets/pubsub-sa.json
      - PUBSUB_TOPIC=gmail-inbox
      - PUBSUB_SUBSCRIPTION=ghook-pull
      # - METRICS_TOKEN=change-me
    volumes:
      - ./data:/data
      - ./google-client.json:/run/secrets/google-client.json:ro
      - ./pubsub-sa.json:/run/secrets/pubsub-sa.json:ro
    healthcheck:
      test: ["CMD", "/ghook", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Behind Traefik, a single host rule is enough. The app serves /login,
    # /privacy, /terms, /healthz and the Google callback itself.
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.ghook.rule=Host(`ghook.example.com`)
    #   - traefik.http.routers.ghook.entryPoints=websecure
    #   - traefik.http.routers.ghook.tls.certresolver=le
    #   - traefik.http.services.ghook.loadbalancer.server.port=8080
